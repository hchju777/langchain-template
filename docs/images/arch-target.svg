<text x="911.0" y="411.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">render</text>
<path d="M 986 406 L 1024 406" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1024" y="384" width="150" height="44" rx="7" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1099.0" y="411.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">deliver</text>
<rect x="1022" y="140" width="200" height="48" rx="7" fill="#f3f0f7" stroke="#9c8ab8" stroke-width="1.5"/>
<text x="1122.0" y="159.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">config 고정 문서</text>
<text x="1122.0" y="177.0" text-anchor="middle" font-size="10.5" fill="#5c6b7a">SOP · KPI 정의서</text>
<rect x="1022" y="196" width="200" height="48" rx="7" fill="#f3f0f7" stroke="#9c8ab8" stroke-width="1.5"/>
<text x="1122.0" y="215.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">실행 시 첨부 문서</text>
<text x="1122.0" y="233.0" text-anchor="middle" font-size="10.5" fill="#5c6b7a">정비 계획 · 회의록</text>
<rect x="1022" y="252" width="200" height="48" rx="7" fill="#fbf1dd" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1122.0" y="271.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">RAG 어댑터</text>
<text x="1122.0" y="289.0" text-anchor="middle" font-size="10.5" fill="#5c6b7a">향후 — 포트 교체만</text>
<path d="M 1022 164 L 1004 164 L 1004 248 L 986 248" fill="none" stroke="#9c8ab8" stroke-width="1.6" marker-end="url(#ap)"/>
<path d="M 1022 220 L 1004 220 L 1004 256 L 986 256" fill="none" stroke="#9c8ab8" stroke-width="1.6" marker-end="url(#ap)"/>
<path d="M 1022 276 L 1004 276 L 1004 266 L 986 266" fill="none" stroke="#c9a227" stroke-width="1.6" marker-end="url(#af)" stroke-dasharray="5 3"/>
<text x="1122" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5c6b7a">ReferencePort — 인용 가능한 ID 부여</text>
<rect x="60" y="470" width="1114" height="46" rx="7" fill="#f3f0f7" stroke="#9c8ab8" stroke-width="1.5"/>
<text x="617.0" y="498.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2933">공용 데이터 어댑터 — Redis / MongoDB / Kafka / REST</text>
<path d="M 654 436 L 654 468" fill="none" stroke="#9c8ab8" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M 415 578 L 415 518" fill="none" stroke="#9c8ab8" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="1186" y="496" text-anchor="start" font-size="11.5" font-weight="400" fill="#5c6b7a">공유</text>
<rect x="60" y="552" width="900" height="130" rx="10" fill="none" stroke="#5aa172" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="74" y="573" font-size="12.5" font-weight="600" fill="#5aa172">별도 경로 — 사람이 실시간으로 검증</text>
<rect x="82" y="582" width="190" height="60" rx="7" fill="#e3f3e8" stroke="#5aa172" stroke-width="1.5"/>
<text x="177.0" y="607.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">온디맨드 질의</text>
<text x="177.0" y="625.0" text-anchor="middle" font-size="11" fill="#5c6b7a">사람이 대화형으로</text>
<path d="M 272 612 L 300 612" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="300" y="582" width="230" height="60" rx="7" fill="#fbf1dd" stroke="#c9a227" stroke-width="1.5"/>
<text x="415.0" y="607.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">질의 에이전트</text>
<text x="415.0" y="625.0" text-anchor="middle" font-size="11" fill="#5c6b7a">자유 tool-calling 허용</text>
<path d="M 530 612 L 558 612" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="558" y="582" width="160" height="60" rx="7" fill="#e3f3e8" stroke="#5aa172" stroke-width="1.5"/>
<text x="638.0" y="607.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2933">사람이 확인</text>
<text x="638.0" y="625.0" text-anchor="middle" font-size="11" fill="#5c6b7a">되묻고 걸러냄</text>
<text x="742" y="604" text-anchor="start" font-size="11.5" font-weight="400" fill="#5c6b7a">재현성 · 무인 안정성 요구가</text>
<text x="742" y="623" text-anchor="start" font-size="11.5" font-weight="400" fill="#5c6b7a">적용되지 않는 영역</text>
<rect x="60" y="700" width="1114" height="116" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="74" y="721" font-size="12.5" font-weight="600" fill="#5c6b7a">이 구조가 유지하는 것과 새로 얻는 것</text>
<rect x="856" y="708" width="16" height="13" rx="3" fill="#e3f3e8" stroke="#5aa172" stroke-width="1.4"/>
<text x="879" y="719" text-anchor="start" font-size="12" font-weight="400" fill="#5c6b7a">신규 · 변경</text>
<rect x="1006" y="708" width="16" height="13" rx="3" fill="#fbf1dd" stroke="#c9a227" stroke-width="1.4"/>
<text x="1029" y="719" text-anchor="start" font-size="12" font-weight="400" fill="#5c6b7a">향후 확장</text>
<text x="82" y="748" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">유지 — 같은 (as_of, 질의)면 같은 결과 · 분석 단위 실패 격리 · 근거 전수 대조 · replay · 부팅 시 config 검증</text>
<text x="82" y="774" text-anchor="start" font-size="12.5" font-weight="400" fill="#5aa172">확보 — 질의에 따른 초점과 범위 조정 · 참고 문서 반영 · 분석 내부의 조건 분기 · 사람이 검증하는 자율 조회 경로</text>
<text x="82" y="800" text-anchor="start" font-size="12.5" font-weight="400" fill="#8a6d1f">향후 — ReferencePort를 RAG 어댑터로 교체 · decide_next를 tool-calling으로 교체 (교체 지점이 각각 한 곳에 모여 있다)</text>
</svg>