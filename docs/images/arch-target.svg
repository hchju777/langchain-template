<rect x="538" y="368" width="232" height="38" rx="7" fill="#f7f8fa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="654.0" y="392.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">kafka.lag</text>
<text x="654" y="424" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5c6b7a">선택 안 된 분석은 실행되지 않는다</text>
<path d="M 788 256 L 836 256" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
