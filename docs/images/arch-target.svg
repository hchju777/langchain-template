<rect width="1240" height="842" fill="#ffffff"/>
<text x="620.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">그림 2. 최종 구조</text>
<text x="620.0" y="57" text-anchor="middle" font-size="13" font-weight="400" fill="#5c6b7a">질의가 초점과 범위를 정하고, 검증은 코드가 유지하며, 자율 판단은 사람이 실시간 확인하는 경로로 분리한다</text>
<rect x="60" y="88" width="190" height="50" rx="7" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
<text x="155.0" y="108.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">스케줄러</text>
<text x="155.0" y="126.0" text-anchor="middle" font-size="11" fill="#5c6b7a">질의 없음</text>
<rect x="280" y="88" width="210" height="50" rx="7" fill="#e3f3e8" stroke="#5aa172" stroke-width="1.5"/>
<text x="385.0" y="108.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">CLI --query "..."</text>
<text x="385.0" y="126.0" text-anchor="middle" font-size="11" fill="#5c6b7a">사람이 질의</text>
<path d="M 155 138 L 230 152" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 385 138 L 350 152" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="140" y="156" width="300" height="52" rx="7" fill="#e3f3e8" stroke="#5aa172" stroke-width="1.5"/>
<text x="290.0" y="177.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">BaseContext</text>
<text x="290.0" y="195.0" text-anchor="middle" font-size="11" fill="#5c6b7a">as_of + query (thread_id · 멱등키에 반영)</text>
<path d="M 290 208 L 290 222" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="116" y="224" width="348" height="60" rx="7" fill="#e7edfb" stroke="#6b8fd6" stroke-width="1.5"/>
<text x="290.0" y="249.0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">analyze_query</text>
<text x="290.0" y="267.0" text-anchor="middle" font-size="11.5" fill="#5c6b7a">질의 → Requirement{초점, 대상 분석, 사유}</text>
<rect x="116" y="290" width="348" height="34" rx="7" fill="#fdeaea" stroke="#c86b6b" stroke-width="1.5"/>
<text x="290.0" y="312.0" text-anchor="middle" font-size="11.8" font-weight="600" fill="#1f2933">가드레일 — 대상 ⊆ config enabled, 위반 시 전체 실행</text>
<text x="290" y="350" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5c6b7a">질의가 없으면 이 단계를 건너뛰고 지금과 동일하게 전체 실행</text>
