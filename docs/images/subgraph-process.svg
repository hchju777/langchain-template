<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="476" viewBox="0 0 1200 476" font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa172"/></marker>
  <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b8fd6"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9c8ab8"/></marker>
  <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a227"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c86b6b"/></marker>
</defs>
<rect width="1200" height="476" fill="#ffffff"/>
<text x="600.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">그림 3. 서브그래프 내부 — process의 확장</text>
<text x="600.0" y="57" text-anchor="middle" font-size="13" font-weight="400" fill="#5c6b7a">단계를 나눠 교체 가능하게 하고, 분기 판단만 LLM이 맡는다</text>
<rect x="40" y="84" width="520" height="322" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="54" y="105" font-size="12.5" font-weight="600" fill="#5c6b7a">현재 — process는 메서드 하나</text>
<rect x="66" y="144" width="104" height="44" rx="7" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
<text x="118.0" y="171.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">validate</text>
<path d="M 170 166 L 194 166" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="194" y="132" width="216" height="68" rx="7" fill="#dde5ef" stroke="#94a3b8" stroke-width="1.5"/>
<text x="302.0" y="155.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2933">process</text>
<text x="302.0" y="173.0" text-anchor="middle" font-size="11" fill="#5c6b7a">fetch · compute · judge가</text>
<text x="302.0" y="187.0" text-anchor="middle" font-size="11" fill="#5c6b7a">한 함수 안에 있다</text>
<path d="M 410 166 L 434 166" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="434" y="144" width="100" height="44" rx="7" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
<text x="484.0" y="171.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">output</text>
<text x="66" y="236" text-anchor="start" font-size="12.5" font-weight="400" fill="#5c6b7a">· 단계별로 갈아끼울 수 없다</text>
<text x="66" y="262" text-anchor="start" font-size="12.5" font-weight="400" fill="#5c6b7a">· 중간에 조건 분기를 넣을 자리가 없다</text>
<text x="66" y="288" text-anchor="start" font-size="12.5" font-weight="400" fill="#5c6b7a">· 실패하면 fetch부터 다시 시작한다</text>
<text x="66" y="314" text-anchor="start" font-size="12.5" font-weight="400" fill="#5c6b7a">· 체크포인트가 process 통째로 하나다</text>
<text x="66" y="360" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">판정에 LLM을 쓰는 경로는 이미 있다</text>
<text x="66" y="382" text-anchor="start" font-size="12" font-weight="400" fill="#5c6b7a">(kpi.check의 use_llm_judge)</text>
<path d="M 568 244 L 618 244" fill="none" stroke="#5aa172" stroke-width="2.2" marker-end="url(#ag)"/>
<rect x="640" y="84" width="520" height="322" rx="10" fill="none" stroke="#5aa172" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="654" y="105" font-size="12.5" font-weight="600" fill="#5aa172">최종 — process는 중첩 그래프</text>
<rect x="658" y="144" width="88" height="40" rx="7" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
<text x="702.0" y="169.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2933">validate</text>
<path d="M 746 164 L 764 164" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="762" y="118" width="312" height="176" rx="10" fill="none" stroke="#5aa172" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="776" y="139" font-size="12.5" font-weight="600" fill="#5aa172">process (중첩 StateGraph)</text>
<rect x="778" y="146" width="84" height="36" rx="7" fill="#f3f0f7" stroke="#9c8ab8" stroke-width="1.5"/>
<text x="820.0" y="169.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2933">fetch</text>
<path d="M 862 164 L 880 164" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="880" y="146" width="84" height="36" rx="7" fill="#f3f0f7" stroke="#9c8ab8" stroke-width="1.5"/>
<text x="922.0" y="169.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2933">compute</text>
<path d="M 964 164 L 982 164" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="982" y="146" width="76" height="36" rx="7" fill="#e7edfb" stroke="#6b8fd6" stroke-width="1.5"/>
<text x="1020.0" y="169.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2933">judge</text>
<path d="M 1020 182 L 1020 212" fill="none" stroke="#6b8fd6" stroke-width="1.6" marker-end="url(#al)"/>
<rect x="900" y="214" width="158" height="38" rx="7" fill="#e7edfb" stroke="#6b8fd6" stroke-width="1.5"/>
<text x="979.0" y="238.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2933">decide_next</text>
<path d="M 900 233 L 820 233 L 820 182" fill="none" stroke="#6b8fd6" stroke-width="1.6" marker-end="url(#al)"/>
<text x="778" y="278" text-anchor="start" font-size="11" font-weight="400" fill="#5c6b7a">추가 조회 (상한 max_probe_rounds)</text>
<path d="M 1074 164 L 1092 164" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1092" y="144" width="56" height="40" rx="7" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1120.0" y="169.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2933">output</text>
<text x="658" y="314" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">· 단계마다 config로 교체 가능 (nodes override)</text>
<text x="658" y="340" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">· LLM은 어느 노드로 갈지만 정한다</text>
<text x="672" y="361" text-anchor="start" font-size="11.8" font-weight="400" fill="#5c6b7a">각 노드가 무엇을 조회할지는 코드에 고정</text>
<text x="658" y="386" text-anchor="start" font-size="12.5" font-weight="400" fill="#1f2933">· 반복 상한을 넘기면 확신도를 낮춰 부분 실패로</text>
<rect x="40" y="420" width="1120" height="44" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="60" y="448" text-anchor="start" font-size="12.3" font-weight="400" fill="#1f2933">설계 근거 — 오류 탐지 정확도는 최고 52.87%인 반면, 위치를 알려주면 수정 성능은 23~44%p 향상된다 (ACL Findings 2024). 따라서 '언제 확인할지'는 코드가, '무엇이 문제인지'는 LLM이 맡는다.</text>
</svg>